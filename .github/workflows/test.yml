name: Test

# Every push to the two branches and every pull request runs the full gate: the lint, the type check, the
# unit tests and the build in one job, then the browser tests in a second one. The e2e job needs the
# browsers and a server, so it is the slower half of the run, and it starts only when the static checks
# are green (a red lint has no business downloading a browser).
#
# The release is a tag (see release.yml): it builds and publishes on its own, this workflow does not
# touch the dist.

on:
  push:
    branches: [dev, main]

  pull_request:

# a new push to the same branch cancels the previous run: only the newest commit matters
concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: lint, typecheck, test:unit, build
    runs-on: ubuntu-latest
    steps:
      - name: checkout the editor
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: setup node
        uses: actions/setup-node@v7.1.0
        with:
          node-version: 22
          cache: npm

      - name: install
        run: npm ci

      - name: lint
        run: npm run lint

      - name: typecheck
        run: npm run typecheck

      - name: test:unit
        run: npm run test:unit

      # the same command the release runs, so a broken build is not found by the tag
      - name: build
        run: npm run build

  e2e:
    name: e2e (chromium)
    runs-on: ubuntu-latest
    needs: check
    steps:
      - name: checkout the editor
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: setup node
        uses: actions/setup-node@v7.1.0
        with:
          node-version: 22
          cache: npm

      - name: install
        run: npm ci

      # only chromium here: firefox needs a gl driver of its own on a runner without a gpu, and it has no
      # rasteriser to fall back on (its webgl2 goes out with "FEATURE_FAILURE_WEBGL_EXHAUSTED_DRIVERS").
      # The chromium build carries its swiftshader, so it renders the level on the runner as it is. The
      # firefox half of the suite runs locally, where there is a gpu (or a mesa of the developer's own)
      - name: install the browsers
        run: npx playwright install --with-deps chromium

      # the development server is started by the playwright config (`webServer`), no build is needed
      - name: e2e
        run: npm run test:e2e -- --project=chromium

      # a failed browser test is debugged from its trace and screenshot, so they are kept (a few days:
      # the artifacts of a green run are empty, `test-results/` only fills up on a failure)
      - name: upload the traces and the screenshots
        if: failure()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: playwright-results
          path: test-results/
          retention-days: 7
