<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Arx Fatalis Browser Editor</title>
    <!-- cookieless pageviews: the Noden Gaming GoatCounter site, under the /arx prefix (the same as
         the arx-tools.github.io pages); localhost is not counted. Kept on one line, the build does
         not minify the inline scripts of index.html -->
    <script>window.goatcounter={path:function(p){return'/arx'+p}}</script>
    <script
      data-goatcounter="https://noden-gaming.goatcounter.com/count"
      async
      src="https://gc.zgo.at/count.js"
    ></script>
  </head>
  <body>
    <!-- the new shell (the `editor` modules); the old app is archived under `src/_old/` -->
    <div id="app"></div>

    <script type="module" src="/src/editor/main.ts"></script>
  </body>
</html>
